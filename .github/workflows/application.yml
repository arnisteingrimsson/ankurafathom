name: application-contract
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r runtime/requirements.txt jsonschema==4.26.0
      - name: Build native engine
        run: |
          cmake -S . -B build-api -DBUILD_TESTING=OFF -DFATHOM_ARROW_PYTHON="$(command -v python)"
          cmake --build build-api --target fathom --parallel 2
      - name: Test HTTP, metrics and process lifecycle
        run: python application/tests/run.py --engine build-api/fathom --out build-api/application-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-contract
          path: build-api/application-contract
